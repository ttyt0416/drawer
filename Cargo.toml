[workspace]
exclude = ["vendor/ufbx", "vendor/moxcms"]
members = ["crates/xtask", "crates/drawer-infer", "crates/drawer-core", "crates/drawer-app", "crates/drawer-platform"]
resolver = "3"
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
ufbx = { path = "vendor/ufbx" }

moxcms = { path = "vendor/moxcms" }
