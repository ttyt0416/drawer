[package]
name = "drawer-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
unicode-normalization = "=0.1.25"
icu_casemap = "=1.5.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
moxcms = { version = "=0.8.1", features = ["extended_range"] }
tiff = "=0.11.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
ttf-parser = "=0.25.1"
epaint_default_fonts = "=0.36.2"
usvg = { version = "=0.47.0", default-features = false }
resvg = { version = "=0.47.0", default-features = false, features = ["raster-images"] }
svgtypes = "=0.16.1"
base64 = "=0.22.1"

[lints]
workspace = true
