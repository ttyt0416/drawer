[package]
name = "drawer-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
drawer-core = { path = "../drawer-core" }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow"] }
rfd = { version = "=0.17.2", default-features = false }
arboard = { version = "=3.6.1", default-features = false, features = ["image-data"] }
clipboard-win = "=5.4.1"

[lints]
workspace = true

[dev-dependencies]
tiff = "=0.11.3"

[target.'cfg(windows)'.dependencies]
keepawake = "=0.6.1"

michiu_window = "=0.0.3"
winsafe = { version = "=0.0.29", features = ["user"] }
windows = { version = "=0.62.2", features = ["Win32_Foundation"] }
raw-window-handle = "=0.6.2"
